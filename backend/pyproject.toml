[project]
name = "forgeflow-backend"
version = "0.1.0"
description = "ForgeFlow control plane and agent workers"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy==2.0.42",
  "pydantic-settings==2.10.1",
  "redis==6.4.0",
  "httpx==0.28.1",
  "email-validator==2.2.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = ["live_ai: sends paid requests to a configured model provider"]

[tool.ruff]
line-length = 100
target-version = "py312"
