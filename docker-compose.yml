name: forgeflow

x-control-env: &control-env
  APP_ENV: ${APP_ENV:-development}
  APP_NAME: ${APP_NAME:-画板}
  APP_SECRET: ${APP_SECRET:-development-only-change-me-32-chars}
  REDIS_URL: redis://redis:6379/0
  WEB_ORIGIN: http://localhost:3000

x-workspace-volume: &workspace-volume
  type: bind
  source: ${HOST_WORKSPACE_ROOT:-./data/workspaces}
  target: /workspaces

x-host-ssh-volume: &host-ssh-volume
  type: bind
  source: ${HOST_SSH_DIR:-${HOME}/.ssh}
  target: /home/forgeflow/.ssh
  read_only: true
  bind:
    create_host_path: false

services:
  storage-init:
    image: redis:7.4-alpine
    user: "0:0"
    command: ["sh", "-c", "chown 0:0 /provider-secrets && chmod 700 /provider-secrets && chown -R 10001:10001 /data /artifacts /backups /workspaces /runtime /provider-secrets /dependency-cache"]
    restart: "no"
    volumes:
      - sqlite-data:/data
      - artifacts:/artifacts
      - backups:/backups
      - *workspace-volume
      - sandbox-runtime:/runtime
      - provider-secrets:/provider-secrets
      - dependency-cache:/dependency-cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      <<: *control-env
      DATABASE_PATH: /data/forgeflow.db
      ARTIFACT_ROOT: /artifacts
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-this-password}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      AGENT1_LLM_PROVIDER: ${AGENT1_LLM_PROVIDER:-deepseek}
      AGENT1_LLM_BASE_URL: ${AGENT1_LLM_BASE_URL:-https://api.deepseek.com}
      AGENT1_LLM_MODEL: ${AGENT1_LLM_MODEL:-deepseek-v4-flash}
      AGENT2_LLM_PROVIDER: ${AGENT2_LLM_PROVIDER:-deepseek}
      AGENT2_LLM_BASE_URL: ${AGENT2_LLM_BASE_URL:-https://api.deepseek.com}
      AGENT2_LLM_MODEL: ${AGENT2_LLM_MODEL:-deepseek-v4-flash}
      AGENT3_LLM_PROVIDER: ${AGENT3_LLM_PROVIDER:-deepseek}
      AGENT3_LLM_BASE_URL: ${AGENT3_LLM_BASE_URL:-https://api.deepseek.com}
      AGENT3_LLM_MODEL: ${AGENT3_LLM_MODEL:-deepseek-v4-flash}
      AGENT4_LLM_PROVIDER: ${AGENT4_LLM_PROVIDER:-deepseek}
      AGENT4_LLM_BASE_URL: ${AGENT4_LLM_BASE_URL:-https://api.deepseek.com}
      AGENT4_LLM_MODEL: ${AGENT4_LLM_MODEL:-deepseek-v4-flash}
      REPOSITORY_AUTOMATION_ENABLED: ${REPOSITORY_AUTOMATION_ENABLED:-0}
      ARCHITECTURE_AUTO_APPROVE_CONFIDENCE_THRESHOLD: ${ARCHITECTURE_AUTO_APPROVE_CONFIDENCE_THRESHOLD:-90}
      # Non-secret capability flags. Provider tokens remain isolated in Git Worker.
      GITHUB_API_ENABLED: ${GITHUB_TOKEN:+1}
      GITLAB_API_ENABLED: ${GITLAB_TOKEN:+1}
      PROVIDER_SECRET_ROOT: /provider-secrets
    volumes:
      - sqlite-data:/data
      - artifacts:/artifacts
      - provider-secrets:/provider-secrets
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  agent-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    entrypoint: ["/srv/agent-entrypoint.sh"]
    command: ["python", "-m", "app.worker"]
    environment:
      REDIS_URL: redis://redis:6379/0
      ARTIFACT_ROOT: /artifacts
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AGENT1_LLM_PROVIDER: ${AGENT1_LLM_PROVIDER:-deepseek}
      AGENT1_LLM_BASE_URL: ${AGENT1_LLM_BASE_URL:-https://api.deepseek.com}
      AGENT1_LLM_MODEL: ${AGENT1_LLM_MODEL:-deepseek-v4-flash}
      AGENT1_LLM_API_KEY: ${AGENT1_LLM_API_KEY:-}
      AGENT2_LLM_PROVIDER: ${AGENT2_LLM_PROVIDER:-deepseek}
      AGENT2_LLM_BASE_URL: ${AGENT2_LLM_BASE_URL:-https://api.deepseek.com}
      AGENT2_LLM_MODEL: ${AGENT2_LLM_MODEL:-deepseek-v4-flash}
      AGENT2_LLM_API_KEY: ${AGENT2_LLM_API_KEY:-}
      AGENT3_LLM_PROVIDER: ${AGENT3_LLM_PROVIDER:-deepseek}
      AGENT3_LLM_BASE_URL: ${AGENT3_LLM_BASE_URL:-https://api.deepseek.com}
      AGENT3_LLM_MODEL: ${AGENT3_LLM_MODEL:-deepseek-v4-flash}
      AGENT3_LLM_API_KEY: ${AGENT3_LLM_API_KEY:-}
      AGENT4_LLM_PROVIDER: ${AGENT4_LLM_PROVIDER:-deepseek}
      AGENT4_LLM_BASE_URL: ${AGENT4_LLM_BASE_URL:-https://api.deepseek.com}
      AGENT4_LLM_MODEL: ${AGENT4_LLM_MODEL:-deepseek-v4-flash}
      AGENT4_LLM_API_KEY: ${AGENT4_LLM_API_KEY:-}
      REPOSITORY_AUTOMATION_ENABLED: ${REPOSITORY_AUTOMATION_ENABLED:-0}
      PI_AGENT_CORE_ENABLED: ${PI_AGENT_CORE_ENABLED:-1}
      PI_AGENT_CORE_BRIDGE_PATH: /srv/pi-bridge/bridge.mjs
      PI_AGENT_CORE_TIMEOUT_SECONDS: ${PI_AGENT_CORE_TIMEOUT_SECONDS:-900}
      PI_CLARIFIER_MAX_TURNS: ${PI_CLARIFIER_MAX_TURNS:-32}
      PI_STRUCTURED_ROLE_MAX_TURNS: ${PI_STRUCTURED_ROLE_MAX_TURNS:-32}
      PI_ACCEPTANCE_MAX_TURNS: ${PI_ACCEPTANCE_MAX_TURNS:-32}
      PI_DEVELOPER_MAX_TURNS: ${PI_DEVELOPER_MAX_TURNS:-32}
      WORKSPACE_ROOT: /workspaces
      SANDBOX_EXECUTOR_SOCKET: /runtime/sandbox.sock
      MAX_PARALLEL_REQUIREMENTS: ${MAX_PARALLEL_REQUIREMENTS:-2}
    depends_on:
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      sandbox-executor:
        condition: service_started
    read_only: true
    volumes:
      - *workspace-volume
      - artifacts:/artifacts:ro
      - sandbox-runtime:/runtime
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  sandbox-executor:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # Limit the executor cgroup as a whole instead of imposing RLIMIT_AS on
    # each child. Node/WebAssembly reserves large virtual address ranges even
    # when resident memory is modest, so a 2 GiB address-space cap caused
    # false OOM failures in otherwise healthy npm test suites.
    mem_limit: ${SANDBOX_EXECUTOR_MEMORY_LIMIT:-6g}
    command: ["python", "-m", "app.sandbox_executor"]
    networks:
      - sandbox-egress
    environment:
      WORKSPACE_ROOT: /workspaces
      SANDBOX_EXECUTOR_SOCKET: /runtime/sandbox.sock
    depends_on:
      storage-init:
        condition: service_completed_successfully
    read_only: true
    volumes:
      - *workspace-volume
      - sandbox-runtime:/runtime
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  dependency-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.dependency_worker"]
    environment:
      REDIS_URL: redis://redis:6379/0
      WORKSPACE_ROOT: /workspaces
      DEPENDENCY_CACHE_ROOT: /dependency-cache
      DEPENDENCY_INSTALL_TIMEOUT_SECONDS: ${DEPENDENCY_INSTALL_TIMEOUT_SECONDS:-900}
      DEPENDENCY_INSTALL_SCRIPTS: ${DEPENDENCY_INSTALL_SCRIPTS:-0}
      MAX_PARALLEL_REQUIREMENTS: ${MAX_PARALLEL_REQUIREMENTS:-2}
    depends_on:
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    read_only: true
    volumes:
      - *workspace-volume
      - dependency-cache:/dependency-cache
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  git-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.git_worker"]
    environment:
      REDIS_URL: redis://redis:6379/0
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-https://gitlab.com}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      REPOSITORY_AUTOMATION_ENABLED: ${REPOSITORY_AUTOMATION_ENABLED:-0}
      WORKSPACE_ROOT: /workspaces
      ALLOW_LOCAL_GIT: ${ALLOW_LOCAL_GIT:-0}
      MAX_PARALLEL_REQUIREMENTS: ${MAX_PARALLEL_REQUIREMENTS:-2}
      PROVIDER_SECRET_ROOT: /provider-secrets
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    volumes:
      - *workspace-volume
      - *host-ssh-volume
      - provider-secrets:/provider-secrets:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      control-plane:
        condition: service_healthy

  backup:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.backup"]
    environment:
      DATABASE_PATH: /data/forgeflow.db
    volumes:
      - sqlite-data:/data:ro
      - backups:/backups
    profiles: ["tools"]

  workspace-cleanup:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.workspace_cleanup"]
    environment:
      WORKSPACE_ROOT: /workspaces
      WORKSPACE_TTL_HOURS: ${WORKSPACE_TTL_HOURS:-72}
    volumes:
      - *workspace-volume
    profiles: ["tools"]

  restore-verify:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.restore_verify"]
    volumes:
      - backups:/backups:ro
    tmpfs:
      - /tmp:size=512m,mode=1777
    profiles: ["tools"]

  recovery-drill:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.recovery_drill"]
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["tools"]

  lease-drill:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.lease_drill"]
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  sqlite-data:
  redis-data:
  artifacts:
  backups:
  sandbox-runtime:
  provider-secrets:
  dependency-cache:

networks:
  sandbox-egress:
